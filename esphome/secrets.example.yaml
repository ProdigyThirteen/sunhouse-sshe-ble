# Copy to secrets.yaml and fill in. secrets.yaml is git-ignored; keep it that way.

# A 2.4 GHz network that reaches the heater's room (the ESP32 can't see 5 GHz).
wifi_ssid: "your-network"
wifi_password: "your-wifi-password"

# If the board can't join Wi-Fi, it opens a hotspot with this password so you can set new details.
fallback_ap_password: "at-least-8-characters"

# Encrypts the link to Home Assistant and protects updates over Wi-Fi. Make one with:
#   openssl rand -base64 32
api_encryption_key: "REPLACE_WITH_BASE64_KEY"

# Your heater's Bluetooth address (bluetoothctl or a phone BLE scanner shows it as AL6053<Sunhouse>)
# and the 6-digit passkey from its rating label.
heater_mac: "00:00:00:00:00:00"
heater_passkey: 123456
