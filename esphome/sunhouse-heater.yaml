# Sunhouse SSHE storage heater in Home Assistant, through an M5Stack ATOM Lite.
#
# The ATOM keeps the heater's Bluetooth link open (pairing with the label passkey included) and
# shows it in Home Assistant as a thermostat with the heater's other controls alongside. The
# registers are described in ../docs/registers.md.
#
# Never write to the Cypress services 00060000-f8ce-11e4-abf4-0002a5d5c51b and ...c51c. They're
# the heater's firmware bootloader.

substitutions:
  name: sunhouse-heater
  friendly_name: Sunhouse Heater
  svc_control: "00000000-0000-1000-8000-00805f9b34fb"
  svc_live: "00000000-0001-1000-8000-00805f9b34fb"
  poll: 30s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

# One text entry per timer day; see timer-day.yaml.
packages:
  user_timer_monday: !include { file: timer-day.yaml, vars: { entry_id: timer_ut_mon, entry_name: User Timer Monday, timer_mode: 3, day: 0 } }
  user_timer_tuesday: !include { file: timer-day.yaml, vars: { entry_id: timer_ut_tue, entry_name: User Timer Tuesday, timer_mode: 3, day: 1 } }
  user_timer_wednesday: !include { file: timer-day.yaml, vars: { entry_id: timer_ut_wed, entry_name: User Timer Wednesday, timer_mode: 3, day: 2 } }
  user_timer_thursday: !include { file: timer-day.yaml, vars: { entry_id: timer_ut_thu, entry_name: User Timer Thursday, timer_mode: 3, day: 3 } }
  user_timer_friday: !include { file: timer-day.yaml, vars: { entry_id: timer_ut_fri, entry_name: User Timer Friday, timer_mode: 3, day: 4 } }
  user_timer_saturday: !include { file: timer-day.yaml, vars: { entry_id: timer_ut_sat, entry_name: User Timer Saturday, timer_mode: 3, day: 5 } }
  user_timer_sunday: !include { file: timer-day.yaml, vars: { entry_id: timer_ut_sun, entry_name: User Timer Sunday, timer_mode: 3, day: 6 } }
  out_all_day_monday: !include { file: timer-day.yaml, vars: { entry_id: timer_oad_mon, entry_name: Out All Day Monday, timer_mode: 1, day: 0 } }
  out_all_day_tuesday: !include { file: timer-day.yaml, vars: { entry_id: timer_oad_tue, entry_name: Out All Day Tuesday, timer_mode: 1, day: 1 } }
  out_all_day_wednesday: !include { file: timer-day.yaml, vars: { entry_id: timer_oad_wed, entry_name: Out All Day Wednesday, timer_mode: 1, day: 2 } }
  out_all_day_thursday: !include { file: timer-day.yaml, vars: { entry_id: timer_oad_thu, entry_name: Out All Day Thursday, timer_mode: 1, day: 3 } }
  out_all_day_friday: !include { file: timer-day.yaml, vars: { entry_id: timer_oad_fri, entry_name: Out All Day Friday, timer_mode: 1, day: 4 } }
  out_all_day_saturday: !include { file: timer-day.yaml, vars: { entry_id: timer_oad_sat, entry_name: Out All Day Saturday, timer_mode: 1, day: 5 } }
  out_all_day_sunday: !include { file: timer-day.yaml, vars: { entry_id: timer_oad_sun, entry_name: Out All Day Sunday, timer_mode: 1, day: 6 } }

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption: {}   # uses the API key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Sunhouse Heater Fallback"
    password: !secret fallback_ap_password

captive_portal:

# For the boost and holiday end times: the heater only reports hours and days left.
time:
  - platform: homeassistant
    id: ha_time

# ---------------------------------------------------------------- Bluetooth link
esp32_ble:
  # The heater wants the passkey from its label typed in, and the bond kept so it's only asked once.
  io_capability: keyboard_only
  auth_req_mode: bond_mitm

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: !secret heater_mac
    id: heater
    on_passkey_request:
      then:
        - logger.log: "Heater asked for its passkey; sending the one from secrets"
        - ble_client.passkey_reply:
            id: heater
            passkey: !secret heater_passkey
    on_connect:
      then:
        # The heater never asks for encryption. It refuses every read with "insufficient
        # authentication" instead, so start it here. The first time, this is when the passkey is
        # sent; after that the stored bond is enough.
        - lambda: |-
            const esp_err_t result = id(heater)->pair();

            if (result != ESP_OK)
            {
                ESP_LOGW("sunhouse", "Couldn't start encryption (error %d)", result);
            }
        - wait_until:
            condition:
              lambda: "return id(heater)->is_paired();"
            timeout: 30s
        - if:
            condition:
              lambda: "return !id(heater)->is_paired();"
            then:
              - logger.log: { level: WARN, format: "The link isn't encrypted yet, so reads will fail until it is" }
        - binary_sensor.template.publish:
            id: heater_connected
            state: true
        - light.turn_off: status_led
        # Read everything now rather than waiting for each poll.
        - delay: 2s
        - component.update: setpoint_in_force
        - component.update: control_block
        - component.update: open_window_block
        - component.update: override_block
        - component.update: holiday_block
        - script.execute: read_temperatures
        - delay: 3s
        - script.execute: read_charging
        - delay: 2s
        - script.execute: read_timers
    on_disconnect:
      then:
        - binary_sensor.template.publish:
            id: heater_connected
            state: false
        - light.turn_on: { id: status_led, red: 100%, green: 0%, blue: 0%, brightness: 15% }

globals:
  # The last raw value of each register written back with one byte changed, so the write
  # leaves the rest of it as the heater had it.
  - id: control_bytes          # S0/1001
    type: std::vector<uint8_t>
  - id: open_window_bytes      # S0/1007
    type: std::vector<uint8_t>
  - id: holiday_bytes          # S0/1004
    type: std::vector<uint8_t>
  # Each timer day as last read: User Timer Monday to Sunday, then Out All Day. A write keeps the
  # temperatures stored with its periods.
  - id: timer_days
    type: std::vector<std::vector<uint8_t>>
    initial_value: "std::vector<std::vector<uint8_t>>(14)"
  - id: timer_write
    type: std::vector<uint8_t>
  - id: is_timer_write_ready
    type: bool
    initial_value: "false"
  # The mode to go back to when Holiday is switched off.
  - id: mode_before_holiday
    type: uint8_t
    restore_value: true
    initial_value: "0x03"
  - id: next_holiday_days
    type: int
    restore_value: true
    initial_value: "3"
  - id: last_boost_hours
    type: int
    initial_value: "-1"

# ---------------------------------------------------------------- Reads
sensor:
  # Room and core temperature share S1/0008: write the sensor number, then read it back with
  # the reading. read_temperatures does both in turn.
  - platform: ble_client
    type: characteristic
    ble_client_id: heater
    id: temperature_block
    internal: true
    service_uuid: ${svc_live}
    characteristic_uuid: "0008"
    update_interval: never
    lambda: |-
      if (x.size() < 3)
      {
          return NAN;
      }

      const float reading = static_cast<float>(x[1]) + static_cast<float>(x[2]) / 10.0f;

      if (x[0] == 1)
      {
          id(room_temperature).publish_state(reading);
      }
      else if (x[0] == 3)
      {
          id(core_temperature).publish_state(reading);
      }

      return static_cast<float>(x[0]);

  - platform: template
    id: room_temperature
    name: Room temperature
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: core_temperature
    name: Core temperature
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: never

  # S1/0003 answers for whichever relay was asked for last; read_charging asks for relay 1,
  # the core element.
  - platform: ble_client
    type: characteristic
    ble_client_id: heater
    id: relay_block
    internal: true
    service_uuid: ${svc_live}
    characteristic_uuid: "0003"
    update_interval: never
    lambda: |-
      if (x.size() < 2)
      {
          return NAN;
      }

      if (x[0] == 1)
      {
          id(core_relay).publish_state(x[1] != 0);
          id(charging).publish_state(id(core_relay).state && id(off_peak).state);
      }

      return static_cast<float>(x[0]);

  - platform: ble_client
    type: characteristic
    ble_client_id: heater
    id: off_peak_block
    internal: true
    service_uuid: ${svc_live}
    characteristic_uuid: "000E"
    update_interval: 60s
    lambda: |-
      if (x.empty())
      {
          return NAN;
      }

      id(off_peak).publish_state(x[0] != 0);
      id(charging).publish_state(id(core_relay).state && id(off_peak).state);
      return static_cast<float>(x[0]);

  - platform: ble_client
    type: characteristic
    ble_client_id: heater
    id: fault_code
    name: Fault code
    icon: mdi:alert-circle-outline
    entity_category: diagnostic
    accuracy_decimals: 0
    service_uuid: ${svc_control}
    characteristic_uuid: "1011"
    update_interval: 60s
    lambda: |-
      if (x.empty())
      {
          return NAN;
      }

      id(fault).publish_state(sunhouse_climate::HeaterFaults::Describe(x[0]));
      id(has_fault).publish_state(x[0] != 0);
      return static_cast<float>(x[0]);

  # S0/1002 answers with whichever timer day was asked for last; read_timers and write_timer_day
  # ask first. The record names its own timer and day, so the answer goes to the right entry.
  - platform: ble_client
    type: characteristic
    ble_client_id: heater
    id: timer_record
    internal: true
    service_uuid: ${svc_control}
    characteristic_uuid: "1002"
    update_interval: never
    lambda: |-
      namespace WeeklyTimer = sunhouse_climate::WeeklyTimer;

      if (x.size() < WeeklyTimer::kRecordSize || x[2] > 6 || (x[1] != WeeklyTimer::kUserTimer && x[1] != WeeklyTimer::kOutAllDay))
      {
          return NAN;
      }

      text::Text* const entries[] = {
          id(timer_ut_mon), id(timer_ut_tue), id(timer_ut_wed), id(timer_ut_thu), id(timer_ut_fri), id(timer_ut_sat), id(timer_ut_sun),
          id(timer_oad_mon), id(timer_oad_tue), id(timer_oad_wed), id(timer_oad_thu), id(timer_oad_fri), id(timer_oad_sat), id(timer_oad_sun),
      };

      const std::size_t index = (x[1] == WeeklyTimer::kUserTimer ? 0 : 7) + x[2];
      id(timer_days)[index] = x;
      entries[index]->publish_state(WeeklyTimer::FormatDay(x));
      return static_cast<float>(x[1]);

  # S0/1003, the target temperature. Also drops to the frost temperature during a Holiday.
  - platform: ble_client
    type: characteristic
    ble_client_id: heater
    id: setpoint_in_force
    name: Setpoint in force
    entity_category: diagnostic
    service_uuid: ${svc_control}
    characteristic_uuid: "1003"
    device_class: temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: ${poll}
    lambda: |-
      if (x.size() < 2)
      {
          return NAN;
      }

      return static_cast<float>(x[0] | (x[1] << 8));
    on_value:
      then:
        - lambda: "id(target_temperature).publish_state(x);"

  # S0/1001: byte 1 is the mode and byte 3 the boost hours. The sensor itself is the boost hours;
  # the mode, boost and holiday entities are all set from the same read.
  - platform: ble_client
    type: characteristic
    ble_client_id: heater
    id: control_block
    name: Boost hours
    icon: mdi:rocket-launch
    service_uuid: ${svc_control}
    characteristic_uuid: "1001"
    accuracy_decimals: 0
    update_interval: ${poll}
    lambda: |-
      if (x.size() < 4)
      {
          return NAN;
      }

      id(control_bytes) = x;

      switch (x[1])
      {
      case 0x01:
          id(heater_mode).publish_state("Out All Day");
          break;
      case 0x03:
          id(heater_mode).publish_state("User Timer");
          break;
      case 0x04:
          id(heater_mode).publish_state("Holiday");
          break;
      default:
          ESP_LOGW("sunhouse", "The heater reported mode 0x%02x, which this doesn't know", x[1]);
          break;
      }

      if (x[1] == 0x01 || x[1] == 0x03)
      {
          id(mode_before_holiday) = x[1];
      }

      id(holiday).publish_state(x[1] == 0x04);

      if (x[1] != 0x04)
      {
          id(holiday_ends).publish_state(NAN);
      }

      id(boost).publish_state(x[3] == 0 ? "Off" : x[3] == 1 ? "1 hour" : "2 hours");
      id(quick_boost).publish_state(x[3] != 0);

      // The heater doesn't count a boost down, so time it from when it's first seen.
      if (x[3] != id(last_boost_hours))
      {
          const ESPTime now = id(ha_time).now();

          if (x[3] == 0)
          {
              id(boost_ends).publish_state(NAN);
          }
          else if (now.is_valid())
          {
              id(boost_ends).publish_state(static_cast<float>(now.timestamp + x[3] * 3600));
          }

          id(last_boost_hours) = x[3];
      }

      return static_cast<float>(x[3]);

  # S0/1004: byte 0 is the days left of a Holiday, byte 2 the frost temperature.
  - platform: ble_client
    type: characteristic
    ble_client_id: heater
    id: holiday_block
    internal: true
    service_uuid: ${svc_control}
    characteristic_uuid: "1004"
    update_interval: ${poll}
    lambda: |-
      if (x.size() < 3)
      {
          return NAN;
      }

      id(holiday_bytes) = x;
      const bool isOnHoliday = id(control_block).has_state() && id(holiday).state;

      if (isOnHoliday && x[0] > 0)
      {
          id(holiday_days).publish_state(x[0]);
          const ESPTime now = id(ha_time).now();

          if (now.is_valid())
          {
              // The panel gives a return date, not a time, so the Holiday ends at the start of that day.
              const time_t midnight = now.timestamp - (now.hour * 3600 + now.minute * 60 + now.second);
              id(holiday_ends).publish_state(static_cast<float>(midnight + x[0] * 86400));
          }
      }
      else
      {
          id(holiday_days).publish_state(id(next_holiday_days));
      }

      return static_cast<float>(x[0]);

  - platform: template
    id: boost_ends
    name: Boost ends
    icon: mdi:timer-sand
    device_class: timestamp
    update_interval: never

  - platform: template
    id: holiday_ends
    name: Holiday ends
    icon: mdi:calendar-end
    device_class: timestamp
    update_interval: never

  - platform: ble_client
    type: characteristic
    ble_client_id: heater
    id: open_window_block
    internal: true
    service_uuid: ${svc_control}
    characteristic_uuid: "1007"
    update_interval: ${poll}
    lambda: |-
      if (x.empty())
      {
          return NAN;
      }

      id(open_window_bytes) = x;
      id(open_window).publish_state(x[0] != 0);
      return static_cast<float>(x[0]);

  # S0/100D: 00 nothing, 01 Advance, 02 and 03 a boost.
  - platform: ble_client
    type: characteristic
    ble_client_id: heater
    id: override_block
    internal: true
    service_uuid: ${svc_control}
    characteristic_uuid: "100D"
    update_interval: ${poll}
    lambda: |-
      if (x.empty())
      {
          return NAN;
      }

      id(advance).publish_state(x[0] == 0x01);
      return static_cast<float>(x[0]);

  - platform: wifi_signal
    name: Wi-Fi signal
    update_interval: 120s

binary_sensor:
  # The core element's relay stays closed through the day, but on a dual supply the element sits
  # on the off-peak circuit, so it only draws power (charges) while that supply is live.
  - platform: template
    id: core_relay
    name: Core element relay
    icon: mdi:electric-switch-closed
    entity_category: diagnostic

  - platform: template
    id: charging
    name: Charging
    icon: mdi:battery-charging-high
    device_class: battery_charging

  - platform: template
    id: off_peak
    name: Off-peak supply
    icon: mdi:transmission-tower
    device_class: power

  - platform: template
    id: has_fault
    name: Fault
    device_class: problem

  - platform: template
    id: heater_connected
    name: Heater connected
    device_class: connectivity
    entity_category: diagnostic

  # The button on top of the ATOM: a click turns a 1-hour boost on or off, holding it for a
  # second starts a 2-hour boost.
  - platform: gpio
    id: atom_button
    internal: true
    pin:
      number: GPIO39
      inverted: true
    on_click:
      - min_length: 50ms
        max_length: 800ms
        then:
          - script.execute: flash_led
          - if:
              condition:
                lambda: "return id(control_block).state > 0;"
              then:
                - select.set: { id: boost, option: "Off" }
              else:
                - select.set: { id: boost, option: "1 hour" }
      - min_length: 1s
        max_length: 4s
        then:
          - script.execute: flash_led
          - select.set: { id: boost, option: "2 hours" }

text_sensor:
  - platform: template
    id: fault
    name: Fault
    icon: mdi:alert-circle-outline

# ---------------------------------------------------------------- Writes
number:
  # During a Holiday this is the heater's own count of days left, and changing it moves the return
  # date. Otherwise it's how long the next Holiday from the switch will be.
  - platform: template
    id: holiday_days
    name: Holiday days
    icon: mdi:calendar-range
    min_value: 1
    max_value: 60
    step: 1
    mode: box
    unit_of_measurement: d
    optimistic: false
    set_action:
      - lambda: "id(next_holiday_days) = static_cast<int>(x);"
      - if:
          condition:
            lambda: "return id(holiday).state;"
          then:
            - script.execute: { id: write_holiday_days, days: !lambda "return static_cast<int>(x);" }
          else:
            - lambda: "id(holiday_days).publish_state(x);"

  - platform: template
    id: target_temperature
    name: Target temperature
    icon: mdi:thermometer
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 5
    max_value: 30
    step: 1
    mode: box
    optimistic: false
    set_action:
      - if:
          condition:
            lambda: "return id(heater_connected).state;"
          then:
            - ble_client.ble_write:
                id: heater
                service_uuid: ${svc_control}
                characteristic_uuid: "1003"
                value: !lambda "return std::vector<uint8_t>{static_cast<uint8_t>(lroundf(x)), 0x00};"
            - delay: 1s
            - component.update: setpoint_in_force
          else:
            - logger.log: { level: WARN, format: "The heater isn't connected, so the target wasn't sent" }

select:
  - platform: template
    id: heater_mode
    name: Heater mode
    icon: mdi:radiator
    options: ["Out All Day", "User Timer", "Holiday"]
    optimistic: false
    set_action:
      - if:
          condition:
            lambda: "return id(heater_connected).state;"
          then:
            # Read the block again first, so a boost that started since the last poll isn't
            # written back as off.
            - component.update: control_block
            - delay: 1500ms
            - if:
                condition:
                  lambda: "return id(control_bytes).size() >= 4;"
                then:
                  - ble_client.ble_write:
                      id: heater
                      service_uuid: ${svc_control}
                      characteristic_uuid: "1001"
                      value: !lambda |-
                        std::vector<uint8_t> bytes = id(control_bytes);
                        bytes[1] = x == "Out All Day" ? 0x01 : x == "Holiday" ? 0x04 : 0x03;
                        return bytes;
                  - delay: 1500ms
                  - component.update: control_block
                  - component.update: setpoint_in_force
                else:
                  - logger.log: { level: WARN, format: "The mode hasn't been read yet, so it wasn't changed" }
          else:
            - logger.log: { level: WARN, format: "The heater isn't connected, so the mode wasn't sent" }

  - platform: template
    id: boost
    name: Boost
    icon: mdi:rocket-launch
    options: ["Off", "1 hour", "2 hours"]
    optimistic: false
    set_action:
      - if:
          condition:
            lambda: "return id(heater_connected).state;"
          then:
            - ble_client.ble_write:
                id: heater
                service_uuid: ${svc_control}
                characteristic_uuid: "100D"
                value: !lambda |-
                  const uint8_t code = x == "1 hour" ? 0x02 : x == "2 hours" ? 0x03 : 0x00;
                  return std::vector<uint8_t>{code};
            - delay: 1500ms
            - component.update: control_block
            - component.update: override_block
          else:
            - logger.log: { level: WARN, format: "The heater isn't connected, so the boost wasn't sent" }

switch:
  # On starts a Holiday (frost protection) for Holiday days; off goes back to the mode before it.
  - platform: template
    id: holiday
    name: Holiday
    icon: mdi:airplane
    optimistic: false
    turn_on_action:
      - script.execute: start_holiday
    turn_off_action:
      - select.set:
          id: heater_mode
          option: !lambda 'return id(mode_before_holiday) == 0x01 ? "Out All Day" : "User Timer";'

  # A one-tap boost for phone widgets and Apple Home: on is an hour, off cancels. It follows the
  # heater, so a 2-hour boost from the panel shows as on too.
  - platform: template
    id: quick_boost
    name: Quick boost
    icon: mdi:rocket-launch
    optimistic: false
    turn_on_action:
      - select.set: { id: boost, option: "1 hour" }
    turn_off_action:
      - select.set: { id: boost, option: "Off" }

  # A setting rather than an everyday control, which also keeps it out of Apple Home.
  - platform: template
    id: open_window
    name: Open window detection
    icon: mdi:window-open-variant
    entity_category: config
    optimistic: false
    turn_on_action:
      - script.execute: { id: write_open_window, enable: true }
    turn_off_action:
      - script.execute: { id: write_open_window, enable: false }

  # Runs the heater's output ahead of its schedule. Advance shares S0/100D with boost, so turning
  # it off only clears the register when Advance is what's in it.
  - platform: template
    id: advance
    name: Advance
    icon: mdi:fast-forward
    optimistic: false
    turn_on_action:
      - script.execute: { id: write_advance, enable: true }
    turn_off_action:
      - script.execute: { id: write_advance, enable: false }

script:
  # Room, then core.
  - id: read_temperatures
    mode: single
    then:
      - if:
          condition:
            lambda: "return id(heater_connected).state;"
          then:
            - ble_client.ble_write:
                id: heater
                service_uuid: ${svc_live}
                characteristic_uuid: "0008"
                value: [0x01, 0x00, 0x00]
            - delay: 300ms
            - component.update: temperature_block
            - delay: 1s
            - ble_client.ble_write:
                id: heater
                service_uuid: ${svc_live}
                characteristic_uuid: "0008"
                value: [0x03, 0x00, 0x00]
            - delay: 300ms
            - component.update: temperature_block

  - id: read_charging
    mode: single
    then:
      - if:
          condition:
            lambda: "return id(heater_connected).state;"
          then:
            - ble_client.ble_write:
                id: heater
                service_uuid: ${svc_live}
                characteristic_uuid: "0003"
                value: [0x01, 0x00]
            - delay: 300ms
            - component.update: relay_block

  # Every day of both timers: User Timer first, then Out All Day. Takes about 15 seconds.
  - id: read_timers
    mode: single
    then:
      - if:
          condition:
            lambda: "return id(heater_connected).state;"
          then:
            - repeat:
                count: 14
                then:
                  - ble_client.ble_write:
                      id: heater
                      service_uuid: ${svc_control}
                      characteristic_uuid: "1002"
                      value: !lambda |-
                        const int timerMode = iteration < 7 ? sunhouse_climate::WeeklyTimer::kUserTimer : sunhouse_climate::WeeklyTimer::kOutAllDay;
                        return sunhouse_climate::WeeklyTimer::ReadRequest(timerMode, static_cast<int>(iteration % 7));
                  - delay: 300ms
                  - component.update: timer_record
                  - delay: 700ms

  # Writes one day from its text entry, then reads it back, so the entry shows what the heater
  # kept. Text that isn't a valid day is logged and the heater is left alone.
  - id: write_timer_day
    mode: queued
    max_runs: 14   # room for every day at once; the default of 5 drops the rest
    parameters:
      timer_mode: int
      day: int
      value: string
    then:
      - lambda: |-
          const std::size_t index = (timer_mode == sunhouse_climate::WeeklyTimer::kUserTimer ? 0 : 7) + static_cast<std::size_t>(day);
          std::string error;
          const std::vector<uint8_t>& previous = id(timer_days)[index];
          const auto record = sunhouse_climate::WeeklyTimer::BuildWrite(value, timer_mode, day, previous, &error);

          // Everything after the read/write flag matches what the heater already holds
          const bool isUnchanged = record && previous.size() == record->size() &&
                                   std::equal(record->begin() + 1, record->end(), previous.begin() + 1);
          id(is_timer_write_ready) = record.has_value() && !isUnchanged && id(heater_connected).state;

          if (isUnchanged)
          {
              ESP_LOGD("sunhouse", "Timer day %d/%d already matches the heater; nothing sent", timer_mode, day);
          }
          else if (!record)
          {
              ESP_LOGW("sunhouse", "Timer day not sent: %s", error.c_str());
          }
          else if (!id(heater_connected).state)
          {
              ESP_LOGW("sunhouse", "The heater isn't connected, so the timer day wasn't sent");
          }
          else
          {
              id(timer_write) = *record;
          }
      - if:
          condition:
            lambda: "return id(is_timer_write_ready);"
          then:
            - ble_client.ble_write:
                id: heater
                service_uuid: ${svc_control}
                characteristic_uuid: "1002"
                value: !lambda "return id(timer_write);"
            - delay: 1500ms
      - if:
          condition:
            lambda: "return id(heater_connected).state;"
          then:
            - ble_client.ble_write:
                id: heater
                service_uuid: ${svc_control}
                characteristic_uuid: "1002"
                value: !lambda "return sunhouse_climate::WeeklyTimer::ReadRequest(timer_mode, day);"
            - delay: 300ms
            - component.update: timer_record

  # Writing mode 04 starts a one-day Holiday; the length is set straight after.
  - id: start_holiday
    mode: single
    then:
      - select.set: { id: heater_mode, option: "Holiday" }
      - delay: 5s
      - script.execute: { id: write_holiday_days, days: !lambda "return id(next_holiday_days);" }

  - id: write_holiday_days
    mode: queued
    parameters:
      days: int
    then:
      - if:
          condition:
            lambda: "return id(heater_connected).state;"
          then:
            - component.update: holiday_block
            - delay: 1500ms
            - if:
                condition:
                  lambda: "return id(holiday_bytes).size() >= 3 && id(holiday_bytes)[0] != days;"
                then:
                  - ble_client.ble_write:
                      id: heater
                      service_uuid: ${svc_control}
                      characteristic_uuid: "1004"
                      value: !lambda |-
                        std::vector<uint8_t> bytes = id(holiday_bytes);
                        bytes[0] = static_cast<uint8_t>(days);
                        return bytes;
                  - delay: 1500ms
                  - component.update: holiday_block
                  - component.update: control_block
          else:
            - logger.log: { level: WARN, format: "The heater isn't connected, so the holiday length wasn't sent" }

  - id: write_open_window
    mode: queued
    parameters:
      enable: bool
    then:
      - if:
          condition:
            lambda: "return id(heater_connected).state;"
          then:
            - component.update: open_window_block
            - delay: 1500ms
            - if:
                condition:
                  lambda: "return !id(open_window_bytes).empty();"
                then:
                  - ble_client.ble_write:
                      id: heater
                      service_uuid: ${svc_control}
                      characteristic_uuid: "1007"
                      value: !lambda |-
                        std::vector<uint8_t> bytes = id(open_window_bytes);
                        bytes[0] = enable ? 0x01 : 0x00;
                        return bytes;
                  - delay: 1500ms
                  - component.update: open_window_block
          else:
            - logger.log: { level: WARN, format: "The heater isn't connected, so open window detection wasn't changed" }

  - id: write_advance
    mode: queued
    parameters:
      enable: bool
    then:
      - if:
          condition:
            lambda: "return id(heater_connected).state;"
          then:
            - component.update: override_block
            - delay: 1500ms
            - if:
                condition:
                  lambda: "return enable || id(override_block).state == 1;"
                then:
                  - ble_client.ble_write:
                      id: heater
                      service_uuid: ${svc_control}
                      characteristic_uuid: "100D"
                      value: !lambda "return std::vector<uint8_t>{static_cast<uint8_t>(enable ? 0x01 : 0x00)};"
                  - delay: 1500ms
                  - component.update: override_block
                  - component.update: control_block
          else:
            - logger.log: { level: WARN, format: "The heater isn't connected, so Advance wasn't sent" }

  # A quick blue flash to show the button was pressed, then back to the connection colour.
  - id: flash_led
    mode: restart
    then:
      - light.turn_on: { id: status_led, red: 0%, green: 40%, blue: 100%, brightness: 40% }
      - delay: 300ms
      - if:
          condition:
            lambda: "return id(heater_connected).state;"
          then:
            - light.turn_off: status_led
          else:
            - light.turn_on: { id: status_led, red: 100%, green: 0%, blue: 0%, brightness: 15% }

interval:
  - interval: ${poll}
    then:
      - script.execute: read_temperatures
  - interval: 60s
    then:
      - script.execute: read_charging
  - interval: 30min
    then:
      - script.execute: read_timers

# ---------------------------------------------------------------- Thermostat
climate:
  - platform: sunhouse_climate
    # No name of its own, so it takes the device's name.
    id: thermostat
    name: None
    room_sensor: room_temperature
    target_number: target_temperature
    mode_select: heater_mode

# ---------------------------------------------------------------- ATOM Lite hardware
light:
  # Red: not connected to the heater. Off: connected. A blue flash: the button was pressed.
  - platform: esp32_rmt_led_strip
    id: status_led
    name: Status LED
    entity_category: config
    pin: GPIO27
    num_leds: 1
    chipset: ws2812
    channel_colors: GRB
    default_transition_length: 0s

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic
